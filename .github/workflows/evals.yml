name: Agent eval regression gate
on: [push, pull_request]
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rose-regression-report
          path: reports/
